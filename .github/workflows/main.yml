
name: Build PSShop APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'PSShop_Standalone_Project*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p /tmp/psshop-source
          unzip -o "$ZIP" -d /tmp/psshop-source
          cp -R /tmp/psshop-source/. .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and build Android project
        run: |
          PROJECT_DIR=$(find . -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: app/build.gradle not found"
            find . -maxdepth 5 -name build.gradle -print
            exit 1
          fi
          echo "Building project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSShop-Standalone-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
